<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimatAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* --- VARIABLES THEMES (Issues du fichier 1) --- */
    :root { --bg: #fff; --text: #000; }

    /* THEME 1: BRUTALISM */
    body.theme-brutal {
        --bg: #f2f2f2;
        --surface: #ffffff;
        --text: #121212;
        --border: 3px solid #121212;
        --shadow: 5px 5px 0px #121212;
        --green: #4ade80;
        --red: #ef4444;
        --yellow: #facc15;
        --blue: #3b82f6;
        --font-main: 'Space Mono', monospace;
        --radius: 0px;
    }

    /* THEME 2: GLASS */
    body.theme-glass {
        --bg: #0f172a;
        --surface: rgba(30, 41, 59, 0.8);
        --text: #e2e8f0;
        --border: 1px solid rgba(148, 163, 184, 0.2);
        --shadow: 0 10px 30px rgba(0,0,0,0.5);
        --green: #10b981;
        --red: #f43f5e;
        --yellow: #f59e0b;
        --blue: #60a5fa;
        --font-main: 'Inter', sans-serif;
        --radius: 20px;
        background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
    }

    /* --- GLOBAL --- */
    body {
        font-family: var(--font-main);
        background-color: var(--bg);
        color: var(--text);
        margin: 0; height: 100vh; overflow: hidden;
        display: flex; flex-direction: column;
        transition: background 0.3s;
    }

    /* --- TOP BAR --- */
    .top-bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px 30px; background: var(--surface); border-bottom: var(--border);
        z-index: 50;
    }
    
    .logo-group { display: flex; align-items: center; gap: 15px; }
    .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -1px; text-transform: uppercase; }

    .top-actions button {
        background: transparent; border: var(--border); color: var(--text);
        padding: 8px 15px; cursor: pointer; font-family: inherit; font-weight: bold;
        box-shadow: var(--shadow); margin-left: 10px; border-radius: var(--radius);
    }
    .top-actions button:active { transform: translate(2px, 2px); box-shadow: none; }

    /* --- LAYOUT --- */
    .main-container {
        display: grid; grid-template-columns: 1fr 380px; gap: 20px; padding: 20px;
        height: calc(100vh - 70px); box-sizing: border-box;
    }

    /* VISUALIZER / ROBOT AREA */
    .video-wrapper {
        background: #000; border: var(--border); border-radius: var(--radius);
        box-shadow: var(--shadow); position: relative; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
    }
    
    /* Canvas spécifique Robot */
    canvas { 
        width: 100%; height: 100%; display: block; 
        background: radial-gradient(circle, #1a1a1a 0%, #000000 90%);
    }
    /* Webcam cachée mais active pour le tracking */
    video#webcam { 
        position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; 
    }

    /* HUD overlay */
    #hud { 
        position: absolute; top: 20px; left: 20px; 
        font-family: 'Space Mono', monospace;
        font-size: 14px; color: var(--green); 
        text-shadow: 0 0 5px var(--green); 
        pointer-events: none; z-index: 10; font-weight: bold;
        background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px;
    }

    /* CONTROLS RIGHT PANEL */
    .controls-wrapper { display: flex; flex-direction: column; gap: 15px; }
    .panel {
        background: var(--surface); border: var(--border); padding: 20px;
        border-radius: var(--radius); box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        display: flex; flex-direction: column; gap: 15px;
    }

    .input-group label { font-size: 0.75rem; text-transform: uppercase; display: block; margin-bottom: 5px; opacity: 0.7; font-weight: bold; }
    .input-group input, .input-group select, .input-group textarea {
        width: 100%; padding: 12px; background: rgba(0,0,0,0.05);
        border: 1px solid var(--text); color: var(--text);
        font-family: inherit; box-sizing: border-box; border-radius: 4px;
        resize: vertical;
    }
    /* Custom File Input */
    input[type="file"] {
        padding: 10px; font-size: 0.9rem; cursor: pointer;
    }

    /* BUTTONS */
    .btn-big {
        padding: 15px; border: var(--border); font-family: inherit; font-weight: bold; font-size: 1rem;
        cursor: pointer; box-shadow: var(--shadow); border-radius: var(--radius); transition: all 0.2s; text-transform: uppercase;
        width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px;
    }
    .btn-big:hover { transform: translateY(-2px); }
    .btn-big:active { transform: translateY(2px); box-shadow: none; }
    
    .btn-action { background: var(--green); color: #000; }
    .btn-record { background: var(--blue); color: #fff; }
    .btn-outline { background: transparent; color: var(--text); }

    /* OVERLAY GUIDED MODE */
    #guided-overlay { 
        display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        background: var(--bg); z-index: 100; 
        flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    
    .guided-content {
        border: var(--border); padding: 40px; background: var(--surface);
        box-shadow: var(--shadow); border-radius: var(--radius);
        max-width: 600px; width: 90%;
        display: flex; flex-direction: column; align-items: center; gap: 20px;
    }

    #guided-text { font-size: 1.5rem; font-weight: bold; line-height: 1.4; }
    #guided-emo { 
        font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; 
        padding: 5px 15px; background: #000; color: #fff; border-radius: 4px;
    }
    #guided-counter { font-size: 0.9rem; opacity: 0.7; }
</style>
</head>
<body class="theme-brutal">

<div class="top-bar">
    <div class="logo-group">
        <div class="logo"><i class="fas fa-robot"></i> AnimatAI</div>
    </div>
    <div class="top-actions">
        <button onclick="toggleTheme()"><i class="fas fa-adjust"></i> Style</button>
    </div>
</div>

<div class="main-container">
    <div class="video-wrapper" id="videoWrapper">
        <div id="hud"><i class="fas fa-circle-notch fa-spin"></i> SYSTEM: INITIALIZING...</div>
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls-wrapper">
        
        <div class="panel">
            <div class="input-group">
                <label><i class="fas fa-database"></i> Entraînement</label>
            </div>
            <button class="btn-big btn-record" onclick="startGuidedSession()">
                <i class="fas fa-microphone"></i> Session Guidée
            </button>
            <div style="font-size: 0.8rem; opacity: 0.7; text-align: center;">
                Enregistrez votre visage et votre voix pour améliorer l'IA.
            </div>
        </div>

        <div class="panel" style="flex: 1;">
            <div class="input-group">
                <label><i class="fas fa-theater-masks"></i> Emotion (Pour info)</label>
                <select id="emotionSelect">
                    <option value="0">Neutre</option>
                    <option value="1">Joyeux</option>
                    <option value="2">Triste</option>
                    <option value="3">Colère</option>
                </select>
            </div>
            
            <div class="input-group">
                <label><i class="fas fa-music"></i> Fichier Audio (WAV/MP3)</label>
                <input type="file" id="audioInput" accept="audio/*">
            </div>

            <div style="margin-top: auto;">
                <button class="btn-big btn-action" onclick="generateAnimation()">
                    <i class="fas fa-magic"></i> Animer Robot
                </button>
            </div>
        </div>
    </div>
</div>

<div id="guided-overlay">
    <div class="guided-content">
        <div id="guided-counter">PHRASE 1 / 6</div>
        <div id="guided-emo">NEUTRE</div>
        <hr style="width: 50%; border: 1px solid var(--text); opacity: 0.2;">
        <div id="guided-text">Chargement...</div>
        
        <div style="display: flex; gap: 10px; width: 100%; margin-top: 20px;">
            <button id="guided-btn" class="btn-big btn-action" onclick="toggleGuidedRecord()">
                <i class="fas fa-microphone"></i> ENREGISTRER
            </button>
        </div>
        
        <button onclick="exitGuidedMode()" style="background:none; border:none; color:var(--text); cursor:pointer; text-decoration:underline; opacity: 0.6;">
            Annuler / Quitter
        </button>
    </div>
</div>

<script type="module">
    import { FilesetResolver, FaceLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    // THEME TOGGLE
    window.toggleTheme = function() {
        const newTheme = document.body.classList.contains('theme-brutal') ? 'theme-glass' : 'theme-brutal';
        document.body.className = newTheme;
    }

    const BS_NAMES = [
        "_neutral", "browDownLeft", "browDownRight", "browInnerUp", "browOuterUpLeft", "browOuterUpRight", "cheekPuff", "cheekSquintLeft", "cheekSquintRight", "eyeBlinkLeft", "eyeBlinkRight", "eyeLookDownLeft", "eyeLookDownRight", "eyeLookInLeft", "eyeLookInRight", "eyeLookOutLeft", "eyeLookOutRight", "eyeLookUpLeft", "eyeLookUpRight", "eyeSquintLeft", "eyeSquintRight", "eyeWideLeft", "eyeWideRight", "jawForward", "jawLeft", "jawOpen", "jawRight", "mouthClose", "mouthDimpleLeft", "mouthDimpleRight", "mouthFrownLeft", "mouthFrownRight", "mouthFunnel", "mouthLeft", "mouthLowerDownLeft", "mouthLowerDownRight", "mouthPressLeft", "mouthPressRight", "mouthPucker", "mouthRight", "mouthRollLower", "mouthRollUpper", "mouthShrugLower", "mouthShrugUpper", "mouthSmileLeft", "mouthSmileRight", "mouthStretchLeft", "mouthStretchRight", "mouthUpperUpLeft", "mouthUpperUpRight", "noseSneerLeft", "noseSneerRight"
    ];

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const videoWrapper = document.getElementById('videoWrapper');
    const guidedOverlay = document.getElementById('guided-overlay');
    const hud = document.getElementById('hud');

    // Variables pour l'IA et l'enregistrement
    let faceLandmarker, lastTime = -1, isRecording = false, recordedFrames = [], isPlayingAI = false, aiFrames = [], aiFrameIndex = 0;
    
    // Variables pour l'audio (Remplacement de Vosk)
    let mediaRecorder;
    let audioChunks = [];

    const TRAINING_SET = [
        { t: "Système prêt pour l'analyse.", e: 0 },
        { t: "Je vois absolument tout.", e: 0 },
        { t: "Super, ça marche !", e: 1 },
        { t: "Oh non, c'est dommage.", e: 2 },
        { t: "Arrête ça !", e: 3 },
        { t: "A E I O U. Ba Be Bi Bo Bu.", e: 0 }
    ];
    let currentStep = 0;

    // --- MAPPING BLENDSHAPES VERS ROBOT ---
    function mapBlendshapesToRobot(bsMap) {
        const v = (name) => bsMap[name] || 0.0;
        const s = {
            pose: { x: 0.5, y: 0.5, z: 1.0, roll: 0, yaw: 0 },
            eyeL: { h: 1, w: 1, squeeze: 0, y_offset: 0 },
            eyeR: { h: 1, w: 1, squeeze: 0, y_offset: 0 },
            browL: { y: 0, rot: 0 }, browR: { y: 0, rot: 0 },
            mouth: { width: 0, openY: 0, smile: 0, pucker: 0, funnel: 0 }
        };

        const calcEye = (side) => {
            let blink = v(`eyeBlink${side}`);
            let wide = v(`eyeWide${side}`);
            let squint = v(`eyeSquint${side}`);
            let h = Math.max(0.05, 1.0 - blink + (wide * 0.5) - (squint * 0.6));
            return { h: h, w: 1.0 - (squint * 0.2), squeeze: squint, y_offset: (v(`eyeLookDown${side}`) - v(`eyeLookUp${side}`)) * 0.8 };
        };
        s.eyeL = calcEye("Left"); s.eyeR = calcEye("Right");

        s.browL = { y: v("browInnerUp") - v("browDownLeft"), rot: (v("browInnerUp") * 0.5) - (v("browOuterUpLeft") * 0.3) - v("browDownLeft") };
        s.browR = { y: v("browInnerUp") - v("browDownRight"), rot: -(v("browInnerUp") * 0.5) + (v("browOuterUpRight") * 0.3) + v("browDownRight") };

        let open = Math.max(0, v("jawOpen") - v("mouthClose"));
        let wide = (v("mouthSmileLeft") + v("mouthSmileRight")) * 0.5;
        let narrow = v("mouthPucker") + v("mouthFunnel");
        let frown = (v("mouthFrownLeft") + v("mouthFrownRight")) * 0.5;

        s.mouth.openY = open;
        s.mouth.width = 1.0 + (wide * 0.4) - (narrow * 0.5) + (v("mouthStretchLeft") + v("mouthStretchRight"))*0.2;
        s.mouth.smile = wide - frown;
        s.mouth.pucker = v("mouthPucker"); s.mouth.funnel = v("mouthFunnel");
        return s;
    }

    // --- LOGIQUE SESSION GUIDÉE ---
    window.startGuidedSession = function() { 
        guidedOverlay.style.display = 'flex'; 
        currentStep = 0; 
        updateGuidedUI(); 
    }
    
    window.exitGuidedMode = function() { 
        guidedOverlay.style.display = 'none'; 
        if(isRecording) toggleGuidedRecord(); // Arrêt de sécurité
    }
    
    function updateGuidedUI() {
        if(currentStep >= TRAINING_SET.length) { exitGuidedMode(); alert("Merci ! Session terminée."); return; }
        const i = TRAINING_SET[currentStep];
        document.getElementById('guided-text').innerText = i.t;
        document.getElementById('guided-counter').innerText = `PHRASE ${currentStep + 1} / ${TRAINING_SET.length}`;
        const emoText = ["NEUTRE","JOIE","TRISTE","COLERE"][i.e];
        const emoEl = document.getElementById('guided-emo');
        emoEl.innerText = emoText;
        const colors = ["#888", "var(--green)", "var(--blue)", "var(--red)"];
        emoEl.style.backgroundColor = colors[i.e];
        emoEl.style.color = "#fff";
    }

    // --- ENREGISTREMENT AUDIO + DONNÉES ---
    window.toggleGuidedRecord = async function() {
        const btn = document.getElementById('guided-btn');
        
        if(!isRecording) {
            // Démarrage
            try {
                // Demande du flux audio spécifiquement pour l'enregistrement
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                // Quand l'enregistrement s'arrête, on envoie tout
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    
                    // Préparation de l'envoi
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ENVOI...';
                    
                    const jsonData = { 
                        text: TRAINING_SET[currentStep].t, 
                        emotion: TRAINING_SET[currentStep].e, 
                        frames: recordedFrames 
                    };

                    const formData = new FormData();
                    formData.append("json_data", JSON.stringify(jsonData));
                    formData.append("audio_blob", audioBlob, "recording.wav");

                    try {
                        await fetch('/save_data', { 
                            method: 'POST', 
                            body: formData // Pas de Content-Type header manuel avec FormData
                        });
                        
                        currentStep++; 
                        btn.innerHTML = '<i class="fas fa-microphone"></i> ENREGISTRER';
                        btn.style.backgroundColor = 'var(--green)';
                        btn.style.color = '#000';
                        updateGuidedUI();
                    } catch (e) {
                        alert("Erreur d'envoi: " + e);
                        btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ERREUR';
                    }
                };

                mediaRecorder.start();
                isRecording = true; 
                recordedFrames = []; 
                
                btn.innerHTML = '<i class="fas fa-stop"></i> STOP';
                btn.style.backgroundColor = 'var(--red)';
                btn.style.color = '#fff';

            } catch(err) {
                alert("Impossible d'accéder au micro: " + err);
            }

        } else {
            // Arrêt
            isRecording = false; 
            if(mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                // Arrêt du flux audio pour éteindre le micro
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }
    }

    // --- GÉNÉRATION AUDIO-TO-ANIMATION ---
    window.generateAnimation = async function() {
        const fileInput = document.getElementById('audioInput');
        const emo = parseInt(document.getElementById('emotionSelect').value);
        
        if(fileInput.files.length === 0) return alert("Veuillez sélectionner un fichier audio !");

        const btn = document.querySelector('.btn-action');
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> ANALYSE AUDIO...';

        const formData = new FormData();
        formData.append("audio", fileInput.files[0]);
        // Note: Le backend Python actuel calcule l'émotion via l'audio, 
        // mais on pourrait passer l'émotion manuelle si le backend le supportait.

        try {
            const res = await fetch('/predict', { 
                method: 'POST', 
                body: formData 
            });
            const data = await res.json();

            if(data.error) { alert("ERREUR IA : " + data.error); btn.innerHTML = originalContent; return; }

            aiFrames = data.frames; aiFrameIndex = 0; isPlayingAI = true;
            hud.innerHTML = '<i class="fas fa-robot"></i> AI PLAYBACK: ACTIVE';
            hud.style.color = 'var(--blue)';
            
            // Jouer l'audio pour que l'animation corresponde
            const audioUrl = URL.createObjectURL(fileInput.files[0]);
            const audio = new Audio(audioUrl);
            audio.play();
            
        } catch (e) {
            alert("Erreur de connexion serveur");
        }
        btn.innerHTML = originalContent;
    }

    let robotState = mapBlendshapesToRobot({});
    let smoothState = JSON.parse(JSON.stringify(robotState));

    function applyAiVector(vec) {
            const pose = { x: vec[0], y: vec[1], z: vec[2], roll: vec[5], yaw: vec[4] };
            const bsMap = {};
            for(let i=0; i<BS_NAMES.length; i++) { if(i + 6 < vec.length) bsMap[BS_NAMES[i]] = vec[i+6]; }
            const mapped = mapBlendshapesToRobot(bsMap);
            mapped.pose = pose; robotState = mapped;
    }

    // --- BOUCLE PRINCIPALE ---
    async function loop() {
        if (isPlayingAI) {
            if(aiFrameIndex < aiFrames.length) { 
                applyAiVector(aiFrames[aiFrameIndex]); 
                aiFrameIndex++; 
            } else {
                isPlayingAI = false;
                hud.innerHTML = '<i class="fas fa-check"></i> SYSTEM: ONLINE (HD)';
                hud.style.color = 'var(--blue)';
            }
        } else if (video.currentTime !== lastTime && faceLandmarker) {
            lastTime = video.currentTime;
            const res = faceLandmarker.detectForVideo(video, performance.now());
            if (res.faceLandmarks.length > 0) { 
                processInput(res.faceLandmarks[0], res.faceBlendshapes[0].categories); 
                hud.innerHTML = '<i class="fas fa-eye"></i> TRACKING: ACTIVE';
            } else {
                hud.innerHTML = '<i class="fas fa-search"></i> SEARCHING FACE...';
            }
        }
        smooth(); render(); requestAnimationFrame(loop);
    }

    function processInput(landmarks, blendshapesCategories) {
        const bsMap = {};
        blendshapesCategories.forEach(b => bsMap[b.categoryName] = b.score);
        let cx=landmarks[1].x, cy=landmarks[1].y;
        let eyeL=landmarks[33], eyeR=landmarks[263];
        let dx=eyeR.x-eyeL.x, dy=eyeR.y-eyeL.y;
        const pose = { x: 1.0 - cx, y: cy, z: Math.sqrt(dx*dx+dy*dy) * 6.0, roll: -Math.atan2(dy,dx), yaw: (cx-(eyeL.x+eyeR.x)/2)*8 };
        const mapped = mapBlendshapesToRobot(bsMap);
        mapped.pose = pose; robotState = mapped;
        
        if(isRecording) {
            const vec = [ pose.x, pose.y, pose.z, 0, pose.yaw, pose.roll ];
            BS_NAMES.forEach(name => vec.push(bsMap[name] || 0));
            recordedFrames.push(vec);
        }
    }

    function smooth() {
        const f = isPlayingAI ? 0.3 : 0.2; // Un peu plus smooth pour l'IA
        const lerp = (a,b) => a*(1-f) + b*f;
        const r = (curr, target) => { for(let k in target) { if(typeof target[k] === 'object') r(curr[k], target[k]); else curr[k] = lerp(curr[k], target[k]); } };
        r(smoothState, robotState);
    }

    function resize() {
        const rect = videoWrapper.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr; 
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px'; 
        canvas.style.height = rect.height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    setTimeout(resize, 100);

    function render() {
        ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore();
        const s=smoothState;
        const w = canvas.width / (window.devicePixelRatio || 1);
        const h = canvas.height / (window.devicePixelRatio || 1);

        ctx.save();
        ctx.translate(w * s.pose.x, h * s.pose.y);
        ctx.rotate(s.pose.roll);
        ctx.scale(h * s.pose.z, h * s.pose.z);
        ctx.shadowBlur = 30; ctx.shadowColor = "#00a2ff"; ctx.fillStyle = "#FFFFFF"; ctx.imageSmoothingEnabled = true;

        const rr=(c,x,y,w,h,r)=>{if(w<2*r)r=w/2;if(h<2*r)r=h/2;c.beginPath();c.moveTo(x+r,y-h/2);c.arcTo(x+w/2,y-h/2,x+w/2,y+h/2,r);c.arcTo(x+w/2,y+h/2,x-w/2,y+h/2,r);c.arcTo(x-w/2,y+h/2,x-w/2,y-h/2,r);c.arcTo(x-w/2,y-h/2,x+w/2,y-h/2,r);c.closePath()};

        [s.eyeL,s.eyeR].forEach((e,i)=>{
            ctx.save(); ctx.translate(i?0.22:-0.22,-0.15+e.y_offset*0.1);
            ctx.rotate((i?-1:1)*e.squeeze*0.2+(i?s.browR.rot:s.browL.rot)*0.5);
            let w=0.16*e.w,h=0.14*e.h;
            rr(ctx,0,0,w*2,h*2,0.04); ctx.fill();
            if(Math.abs(i?s.browR.y:s.browL.y)>0.1||e.squeeze>0.2){
                ctx.beginPath(); rr(ctx,0,-h-0.05+(i?s.browR.y:s.browL.y)*0.05,w*2.2,0.03,0.01); ctx.fill();
            }
            ctx.restore();
        });

        ctx.save(); ctx.translate(0,0.2);
        let m=s.mouth,cw=0.35*m.width*(1-m.pucker*0.6),ch=Math.max(0.02,0.25*m.openY+m.pucker*0.1),sc=-m.smile*0.1;
        if(ch<0.04){
            ctx.lineWidth=0.03; ctx.lineCap="round"; ctx.strokeStyle="#fff";
            ctx.beginPath(); ctx.moveTo(-cw,sc); ctx.quadraticCurveTo(0,0,cw,sc); ctx.stroke();
        }else{
            ctx.translate(0,sc*0.5); rr(ctx,0,0,cw*2,ch*2,m.pucker>0.5?cw:0.05); ctx.fill();
        }
        ctx.restore(); ctx.restore();
    }

    async function setup() {
        hud.innerText = "LOADING VISION MODELS...";
        try {
            const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(fileset, { baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`, delegate: "GPU" }, outputFaceBlendshapes: true, outputFaceLandmarks: true, runningMode: "VIDEO", numFaces: 1 });
            
            // On demande uniquement la vidéo au démarrage pour le tracking
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
            video.srcObject = stream; 
            video.addEventListener("loadeddata", () => {
                resize();
                loop();
            });
        } catch(e) {
            alert("Erreur initialisation caméra : " + e);
        }
    }
    setup();
</script>
</body>
</html>
